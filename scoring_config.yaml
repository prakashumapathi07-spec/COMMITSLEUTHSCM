# CommitSleuth scoring configuration (CI: scoring_config.yaml)
weights:
  file_match: 0.50     # commit changed a file named in the failure log
  pom_change: 0.25     # pom.xml changed and failure is a dependency problem
  recency: 0.15        # newer commits score slightly higher
  change_size: 0.10    # larger commits are slightly more suspicious
rollback:
  confidence_threshold: 0.60
  max_files_for_isolation: 3
notification:
  enabled: true
  channel: log         # log | email
  template: "Build #{build_no} FAILED ({failure_type}). Suspect commit {commit} by {author}, confidence {confidence}. Action: {action}"
